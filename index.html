<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> I Have a Question For You! </title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #961300;
            text-align: center;
            padding: 50px 20px;
            color: white;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            color: white;
        }
        img {
            width: 100%;
            max-width: 350px;
            border-radius: 15px;
            margin: 20px 0;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        #yesBtn {
            background-color: #4cc9f0;
            color: white;
        }
        #yesBtn:hover {
            background-color: #4361ee;
            transform: scale(1.1);
        }
        #noBtn {
            background-color: #f72585;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="question"> Will you go on a date with me? </h1>
    <img id="dogPic" src="https://pbs.twimg.com/media/EmMgcZ8XIAAJEVB.jpg" alt="Cute Dog">
    
    <div class="btn-container" id="buttons">
        <button id="yesBtn" onclick="sayYes()">Yes! Kocham ciebie bardzo :> </button>
        <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No u_u</button>
    </div>
</div>

<script>
    function sayYes() {
        document.getElementById('question').innerText = "You are my everything!..";
        document.getElementById('dogPic').src = "https://theopiperphotography.co.uk/wp-content/uploads/2023/08/Eaves_Hall_Wedding_Photography-1.jpg";
        document.getElementById('buttons').style.display = 'none';
    }
    function moveNoButton() {
        const noBtn = document.getElementById('noBtn');
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 50);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 50);
        
        noBtn.style.position = 'absolute';
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';
    }
</script>
</body>
</html>
