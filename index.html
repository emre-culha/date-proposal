<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Have a Question For You! 🐶</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e6;
            text-align: center;
            padding: 50px 20px;
            color: #4a4a4a;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            color: #ff4d6d;
        }
        img {
            width: 100%;
            max-width: 350px;
            border-radius: 15px;
            margin: 20px 0;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        #yesBtn {
            background-color: #4cc9f0;
            color: white;
        }
        #yesBtn:hover {
            background-color: #4361ee;
            transform: scale(1.1);
        }
        #noBtn {
            background-color: #f72585;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="question">Will you go on a date with me? 🌹</h1>
    <!-- Cute dog picture placeholder -->
    <img id="dogPic" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=600" alt="Cute Dog">
    
    <div class="btn-container" id="buttons">
        <button id="yesBtn" onclick="sayYes()">Yes! 🐾</button>
        <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No u_u</button>
    </div>
</div>

<script>
    function sayYes() {
        document.getElementById('question').innerText = "Yay! It's a date! 🎉🐶";
        // Changes the dog picture to an even happier dog when she says yes
        document.getElementById('dogPic').src = "https://images.unsplash.com/photo-1534361960057-19889db9621e?q=80&w=600";
        document.getElementById('buttons').style.display = 'none';
    }

    // A classic trick: The "No" button runs away when she tries to click it!
    function moveNoButton() {
        const noBtn = document.getElementById('noBtn');
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 50);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 50);
        
        noBtn.style.position = 'absolute';
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';
    }
</script>

</body>
</html>
